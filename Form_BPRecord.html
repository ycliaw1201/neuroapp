<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血壓紀錄表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        @media print {
            @page {
                size: A4 landscape; /* Changed to landscape for horizontal layout */
                margin: 10mm 15mm; /* Top/Bottom, Left/Right margins */
            }
            body {
                background-color: white;
                font-size: 11pt;
            }
            .no-print {
                display: none !important;
            }
            .page-break {
                page-break-after: always;
                break-after: page;
                box-shadow: none !important; /* Removed shadow on print */
                padding: 0 !important;
                margin-bottom: 0 !important;
                background-color: transparent !important;
            }
            .page-break:last-child {
                page-break-after: auto;
                break-after: auto;
            }
            
            /* Enforce table borders on print */
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                border: 1px solid #000 !important;
            }
            th {
                background-color: #e5e7eb !important;
                -webkit-print-color-adjust: exact;
                color-adjust: exact;
            }
            
            /* Ensure the content fits within the page height */
            .record-row td {
                height: 9.5mm !important; /* Increased cell height significantly for A4 landscape print */
                padding: 2px 4px !important;
            }

            .print-flex-row {
                display: flex !important;
                flex-direction: row !important;
            }
        }

        .screen-container {
            max-width: 1400px; /* Increased to accommodate two columns on screen */
            margin: 0 auto;
        }
        .paper-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Increased cell height for screen display */
        .record-row td {
            height: 48px; 
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="no-print bg-white border-b border-gray-200 sticky top-0 z-10 paper-shadow mb-6">
        <div class="screen-container py-4 px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">血壓紀錄表</h1>
                    <p class="text-xs text-gray-500">自動排版，A4橫向雙欄列印</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-md border border-gray-200">
                    <label for="startDate" class="text-sm font-medium text-gray-700 whitespace-nowrap">就診(開始)日期：</label>
                    <input type="date" id="startDate" class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                
                <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-md border border-gray-200">
                    <label for="duration" class="text-sm font-medium text-gray-700 whitespace-nowrap">紀錄期間：</label>
                    <select id="duration" class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="1">1 個月 (1張)</option>
                        <option value="2">2 個月 (2張)</option>
                        <option value="3">3 個月 (3張)</option>
                    </select>
                </div>

                <button id="generateBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition duration-200 shadow-sm flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    產生表格
                </button>
                <button id="printBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition duration-200 shadow-sm flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    列印表單
                </button>
            </div>
        </div>
    </div>

    <div id="pagesContainer" class="screen-container pb-10 px-2 sm:px-0">
        <!-- Tables will be injected here via JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startDateInput = document.getElementById('startDate');
            const durationSelect = document.getElementById('duration');
            const generateBtn = document.getElementById('generateBtn');
            const printBtn = document.getElementById('printBtn');
            const pagesContainer = document.getElementById('pagesContainer');

            // Initialize date to Today
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            startDateInput.value = `${year}-${month}-${day}`;

            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];

            function getTableHeader() {
                return `
                    <table class="w-full lg:w-1/2 text-[14px] border-collapse border border-gray-800 text-center bg-white">
                        <thead class="bg-gray-100 text-gray-800">
                            <tr>
                                <th rowspan="2" class="border border-gray-800 py-3 w-[12%] text-base">日期</th>
                                <th colspan="2" class="border border-gray-800 py-2 w-[38%] text-base">早上</th>
                                <th colspan="2" class="border border-gray-800 py-2 w-[38%] text-base">晚上</th>
                                <th rowspan="2" class="border border-gray-800 py-3 w-[12%] text-base">備註</th>
                            </tr>
                            <tr class="text-sm">
                                <th class="border border-gray-800 py-2">第1次</th>
                                <th class="border border-gray-800 py-2">第2次</th>
                                <th class="border border-gray-800 py-2">第1次</th>
                                <th class="border border-gray-800 py-2">第2次</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
            }

            function generateRow(dateObj) {
                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                const d = String(dateObj.getDate()).padStart(2, '0');
                const dow = daysOfWeek[dateObj.getDay()];
                const isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);
                const dateTextClass = isWeekend ? 'text-red-600 font-bold' : 'font-bold';

                return `
                    <tr class="record-row hover:bg-gray-50">
                        <td class="border border-gray-800 ${dateTextClass} leading-tight py-1">
                            ${m}/${d}<br><span class="text-[11px] font-normal">(${dow})</span>
                        </td>
                        <td class="border border-gray-800 text-gray-300">/ &nbsp;&nbsp;&nbsp; /</td>
                        <td class="border border-gray-800 text-gray-300">/ &nbsp;&nbsp;&nbsp; /</td>
                        <td class="border border-gray-800 text-gray-300">/ &nbsp;&nbsp;&nbsp; /</td>
                        <td class="border border-gray-800 text-gray-300">/ &nbsp;&nbsp;&nbsp; /</td>
                        <td class="border border-gray-800"></td>
                    </tr>
                `;
            }

            function generateTables() {
                const startDateVal = startDateInput.value;
                if (!startDateVal) return;

                const startDate = new Date(startDateVal);
                const monthsToGenerate = parseInt(durationSelect.value, 10);

                pagesContainer.innerHTML = ''; // Clear existing
                let currentDate = new Date(startDate);

                for (let page = 0; page < monthsToGenerate; page++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'bg-white p-6 sm:p-8 rounded-lg paper-shadow mb-8 page-break';
                    
                    // Header Area (Without the 722 box)
                    let html = `
                        <div class="text-center mb-4">
                            <h2 class="text-2xl font-bold text-gray-800 tracking-wider">血壓紀錄表</h2>
                        </div>
                        <div class="flex justify-between items-end mb-3 text-sm text-gray-700">
                            <div class="flex gap-8">
                                <div><span class="font-bold">姓名：</span><span class="inline-block border-b border-gray-400 w-40"></span></div>
                                <div><span class="font-bold">病歷號：</span><span class="inline-block border-b border-gray-400 w-40"></span></div>
                            </div>
                        </div>
                        <div class="flex flex-col lg:flex-row gap-6 w-full print-flex-row">
                    `;

                    // Table 1: Days 1 to 16
                    html += getTableHeader();
                    for (let i = 0; i < 16; i++) {
                        html += generateRow(currentDate);
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                    html += `</tbody></table>`;

                    // Table 2: Days 17 to 31
                    html += getTableHeader();
                    for (let i = 0; i < 15; i++) {
                        html += generateRow(currentDate);
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                    // Add 1 blank row to balance the 16 rows of the left table
                    html += `
                        <tr class="record-row">
                            <td class="border border-gray-800"></td>
                            <td class="border border-gray-800"></td>
                            <td class="border border-gray-800"></td>
                            <td class="border border-gray-800"></td>
                            <td class="border border-gray-800"></td>
                            <td class="border border-gray-800"></td>
                        </tr>
                    `;
                    html += `</tbody></table></div>`;
                    
                    pageDiv.innerHTML = html;
                    pagesContainer.appendChild(pageDiv);
                }
            }

            generateBtn.addEventListener('click', generateTables);
            startDateInput.addEventListener('change', generateTables);
            durationSelect.addEventListener('change', generateTables);
            
            printBtn.addEventListener('click', () => {
                window.print();
            });

            // Initial Generation
            generateTables();
        });
    </script>
</body>
</html>
