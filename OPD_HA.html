<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一般頭痛臨床評估量表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #e2e8f0; /* slate-200 */
            color: #334155; /* slate-700 */
            /* Try to keep it within view height if possible, but allow scrolling if needed on small screens */
        }
        
        h1, h2, h3, .serif-font {
            font-family: 'Noto Serif TC', serif;
        }

        /* Compact Chip Styles for Checkboxes/Radios */
        .chip-input:checked + span {
            background-color: #1e3a8a; /* blue-900 */
            color: white;
            border-color: #1e3a8a;
        }
        
        .chip-input:focus + span {
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.3);
        }
        
        /* Yes/No specific chips */
        .yn-radio:checked + span {
            background-color: #334155; /* slate-700 */
            color: white;
            border-color: #334155;
        }

        /* Number input without spinners for cleaner look */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Subtle Transitions */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar for the main container */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Section styling */
        .academic-section {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 1rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="min-h-screen p-2 md:p-4 flex justify-center items-start">

    <!-- Main Container: Max width 1280px for wide screens -->
    <div class="w-full max-w-7xl bg-slate-50 border border-slate-300 shadow-xl rounded flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="bg-slate-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shrink-0">
            <div>
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-file-medical text-slate-300"></i>
                    一般頭痛臨床評估量表
                </h1>
                <p class="text-slate-400 text-xs mt-0.5 tracking-widest">CLINICAL HEADACHE ASSESSMENT TOOL</p>
            </div>
            
            <!-- Consent embedded in header for space saving -->
            <label class="flex items-center gap-2 cursor-pointer mt-2 sm:mt-0 bg-slate-800 px-3 py-1.5 rounded border border-slate-600 hover:bg-slate-700 transition">
                <input id="consent" name="consent" type="checkbox" class="w-4 h-4 text-blue-500 border-slate-400 rounded focus:ring-blue-500" onchange="updateSummary()">
                <span class="text-sm font-medium text-slate-200 select-none">同意研究用途</span>
            </label>
        </header>

        <!-- Form Wrapper -->
        <form id="headacheForm" class="flex flex-col lg:flex-row h-full">
            
            <!-- Left Column: Inputs (Scrollable if necessary) -->
            <div class="flex-1 p-4 overflow-y-auto custom-scroll" style="max-height: calc(100vh - 150px);">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Basic & Freq (Compact Grid) -->
                    <div class="academic-section md:col-span-2">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">初發年齡 (Onset)</label>
                                <div class="flex items-center border border-slate-300 rounded px-2 bg-white">
                                    <input type="number" name="first_headache_age" min="0" class="w-full py-1 text-sm outline-none">
                                    <span class="text-xs text-slate-400">歲</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">惡化年齡 (Aggra)</label>
                                <div class="flex items-center border border-slate-300 rounded px-2 bg-white">
                                    <input type="number" name="worse_headache_age" min="0" class="w-full py-1 text-sm outline-none">
                                    <span class="text-xs text-slate-400">歲</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">平均疼痛 (Avg 0-10)</label>
                                <input type="number" name="pain_level_avg" min="0" max="10" class="w-full py-1 px-2 border border-slate-300 rounded text-sm text-center font-bold text-blue-800 outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">最痛程度 (Max 0-10)</label>
                                <input type="number" name="pain_level_max" min="0" max="10" class="w-full py-1 px-2 border border-slate-300 rounded text-sm text-center font-bold text-red-700 outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">頭痛頻率 (Freq)</label>
                                <div class="flex items-center border border-slate-300 rounded px-2 bg-white">
                                    <input type="number" name="days_per_month" min="0" class="w-full py-1 text-sm outline-none">
                                    <span class="text-xs text-slate-400">天/月</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">發作持續 (Dur)</label>
                                <div class="flex items-center border border-slate-300 rounded px-2 bg-white">
                                    <input type="number" name="duration" min="0" class="w-full py-1 text-sm outline-none">
                                    <span class="text-xs text-slate-400">hr</span>
                                </div>
                            </div>
                            <div class="sm:col-span-2 flex items-end">
                                <div class="w-full flex items-center justify-between p-1.5 bg-slate-100 border border-slate-200 rounded">
                                    <span class="text-xs font-bold text-slate-700">脈搏跳動感 (Pulsatile)*</span>
                                    <div class="flex gap-1">
                                        <label class="cursor-pointer">
                                            <input type="radio" name="pulsatile" value="-" class="chip-input sr-only" required>
                                            <span class="inline-block px-3 py-0.5 text-xs border border-slate-300 rounded bg-white text-slate-600 hover:bg-slate-200">否 (-)</span>
                                        </label>
                                        <label class="cursor-pointer">
                                            <input type="radio" name="pulsatile" value="+" class="chip-input sr-only">
                                            <span class="inline-block px-3 py-0.5 text-xs border border-slate-300 rounded bg-white text-slate-600 hover:bg-slate-200">是 (+)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div class="academic-section">
                        <h2 class="section-title">經常頭痛的位置 (Location)</h2>
                        <div class="flex flex-wrap gap-1.5">
                            <script>
                                const locs = ["前額/眉心", "後腦勺", "鼻子周圍", "耳朵", "太陽穴", "眼眶周圍", "臉頰/下顎", "耳朵後", "頭頂(頭心)", "眼球裡/後", "耳朵前", "後頸部"];
                                locs.forEach(l => {
                                    document.write(`
                                        <label class="cursor-pointer">
                                            <input type="checkbox" name="location" value="${l}" class="chip-input sr-only">
                                            <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">${l}</span>
                                        </label>
                                    `);
                                });
                            </script>
                            <div class="flex items-center gap-1">
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="location_other_check" class="chip-input sr-only" onchange="toggleInputInline('loc_other_wrap', this.checked)">
                                    <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">其他</span>
                                </label>
                                <div id="loc_other_wrap" class="hidden items-center fade-in">
                                    <input type="text" name="location_other" id="loc_other_input" class="px-2 py-1 text-xs border-b border-slate-400 focus:border-blue-800 outline-none bg-transparent w-24" placeholder="輸入...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Side -->
                    <div class="academic-section">
                        <h2 class="section-title">頭痛較常位於那一側 (Side)</h2>
                        <div class="flex flex-wrap gap-1.5">
                            <script>
                                const sides = ["右側", "左側", "整個頭", "單側變全部", "有時左有時右", "頭中線", "兩側同時", "有時一側有時兩側"];
                                sides.forEach(s => {
                                    document.write(`
                                        <label class="cursor-pointer">
                                            <input type="checkbox" name="side" value="${s}" class="chip-input sr-only">
                                            <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">${s}</span>
                                        </label>
                                    `);
                                });
                            </script>
                            <div class="flex items-center gap-1">
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="side_other_check" class="chip-input sr-only" onchange="toggleInputInline('side_other_wrap', this.checked)">
                                    <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">其他</span>
                                </label>
                                <div id="side_other_wrap" class="hidden items-center fade-in">
                                    <input type="text" name="side_other" id="side_other_input" class="px-2 py-1 text-xs border-b border-slate-400 focus:border-blue-800 outline-none bg-transparent w-24" placeholder="輸入...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Nature -->
                    <div class="academic-section md:col-span-2">
                        <h2 class="section-title">頭痛的感覺像是 (Nature)</h2>
                        <div class="flex flex-wrap gap-1.5">
                            <script>
                                const natures = ["刺痛", "像冰鑿子鑽", "持續的痛", "擠壓/壓迫/緊縮", "撕裂般", "頸部肌肉疼痛", "壓痛", "爆炸般"];
                                natures.forEach(n => {
                                    document.write(`
                                        <label class="cursor-pointer">
                                            <input type="checkbox" name="nature" value="${n}" class="chip-input sr-only">
                                            <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">${n}</span>
                                        </label>
                                    `);
                                });
                            </script>
                            <div class="flex items-center gap-1">
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="nature_other_check" class="chip-input sr-only" onchange="toggleInputInline('nature_other_wrap', this.checked)">
                                    <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">其他</span>
                                </label>
                                <div id="nature_other_wrap" class="hidden items-center fade-in">
                                    <input type="text" name="nature_other" id="nature_other_input" class="px-2 py-1 text-xs border-b border-slate-400 focus:border-blue-800 outline-none bg-transparent w-32" placeholder="輸入性質...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Symptoms (N, V, L, S, PA) - Compact Row -->
                    <div class="academic-section md:col-span-2 bg-slate-100 border-none">
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                            <script>
                                const symps = [
                                    {id: 'nausea', label: '噁心(N)'},
                                    {id: 'vomiting', label: '嘔吐(V)'},
                                    {id: 'sound_sens', label: '聲音敏感(L)'},
                                    {id: 'light_sens', label: '光線敏感(S)'},
                                    {id: 'movement_aggravation', label: '活動加劇(PA)'}
                                ];
                                symps.forEach(s => {
                                    document.write(`
                                        <div class="flex flex-col items-center justify-center p-2 bg-white rounded border border-slate-200">
                                            <span class="text-xs font-bold text-slate-700 mb-1">${s.label}</span>
                                            <div class="flex w-full bg-slate-100 rounded p-0.5">
                                                <label class="flex-1 cursor-pointer">
                                                    <input type="radio" name="${s.id}" value="-" class="yn-radio sr-only" required>
                                                    <span class="block text-center text-xs py-0.5 rounded text-slate-500 hover:bg-slate-200">否</span>
                                                </label>
                                                <label class="flex-1 cursor-pointer">
                                                    <input type="radio" name="${s.id}" value="+" class="yn-radio sr-only">
                                                    <span class="block text-center text-xs py-0.5 rounded text-slate-500 hover:bg-slate-200">是</span>
                                                </label>
                                            </div>
                                        </div>
                                    `);
                                });
                            </script>
                        </div>
                    </div>

                    <!-- CAS -->
                    <div class="academic-section md:col-span-2">
                        <div class="flex items-center gap-4 mb-2">
                            <h2 class="section-title !mb-0 border-none">自律神經症狀 (CAS)</h2>
                            <div class="flex gap-1">
                                <label class="cursor-pointer">
                                    <input type="radio" name="cas_check" value="no" class="chip-input sr-only" onchange="toggleBlock('cas_details', !this.checked)" checked>
                                    <span class="inline-block px-2 py-0.5 text-xs border border-slate-300 rounded bg-slate-50 text-slate-600">無</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="cas_check" value="yes" class="chip-input sr-only" onchange="toggleBlock('cas_details', this.checked)">
                                    <span class="inline-block px-2 py-0.5 text-xs border border-slate-300 rounded bg-slate-50 text-slate-600">有</span>
                                </label>
                            </div>
                        </div>
                        
                        <div id="cas_details" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2 mt-2 pt-2 border-t border-slate-100 fade-in">
                            <script>
                                const casSymptoms = [
                                    {id: "CI", label: "CI – conjunctival injection/lacrimation"},
                                    {id: "NC", label: "NC – nasal congestion/rhinorrhoea"},
                                    {id: "EE", label: "EE – eyelid oedema"},
                                    {id: "FS", label: "FS – forehead/facial sweating"},
                                    {id: "MP", label: "MP – miosis/ptosis"},
                                    {id: "Rest_Agi", label: "Rest/Agi – restlessness/agitation"}
                                ];

                                casSymptoms.forEach(sym => {
                                    document.write(`
                                        <div class="flex items-center justify-between bg-slate-50 px-2 py-1 rounded border border-slate-200">
                                            <label class="flex items-center space-x-2 cursor-pointer flex-1">
                                                <input type="checkbox" name="cas_symptoms" value="${sym.id}" class="w-3.5 h-3.5 text-blue-800 rounded border-slate-300" onchange="toggleInlineFlex('cas_side_${sym.id}', this.checked)">
                                                <span class="text-xs text-slate-700 whitespace-nowrap overflow-hidden text-ellipsis" title="${sym.label}">${sym.label}</span>
                                            </label>
                                            <div id="cas_side_${sym.id}" class="hidden flex gap-0.5 ml-2 fade-in shrink-0">
                                                <label class="cursor-pointer"><input type="radio" name="cas_side_${sym.id}" value="i" class="yn-radio sr-only"><span class="inline-block px-1.5 py-0.5 text-[10px] border border-slate-300 bg-white text-slate-500 rounded-l">同</span></label>
                                                <label class="cursor-pointer"><input type="radio" name="cas_side_${sym.id}" value="c" class="yn-radio sr-only"><span class="inline-block px-1.5 py-0.5 text-[10px] border-y border-slate-300 bg-white text-slate-500">對</span></label>
                                                <label class="cursor-pointer"><input type="radio" name="cas_side_${sym.id}" value="b" class="yn-radio sr-only"><span class="inline-block px-1.5 py-0.5 text-[10px] border border-slate-300 bg-white text-slate-500 rounded-r">雙</span></label>
                                            </div>
                                        </div>
                                    `);
                                });
                            </script>
                        </div>
                    </div>

                    <!-- Aura -->
                    <div class="academic-section md:col-span-2">
                        <div class="flex items-center gap-4 mb-2">
                            <h2 class="section-title !mb-0 border-none">預兆 (Aura)</h2>
                            <div class="flex gap-1">
                                <label class="cursor-pointer">
                                    <input type="radio" name="aura_check" value="-" class="chip-input sr-only" onclick="toggleBlock('aura_details', false)" checked>
                                    <span class="inline-block px-2 py-0.5 text-xs border border-slate-300 rounded bg-slate-50 text-slate-600">無</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="aura_check" value="+" class="chip-input sr-only" onclick="toggleBlock('aura_details', true)">
                                    <span class="inline-block px-2 py-0.5 text-xs border border-slate-300 rounded bg-slate-50 text-slate-600">有</span>
                                </label>
                            </div>
                        </div>

                        <div id="aura_details" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2 pt-2 border-t border-slate-100 fade-in">
                            <script>
                                const auraTypes = ['visual', 'sensory', 'speech/language', 'motor', 'brainstem', 'retinal'];
                                function setUncertain(id) {
                                    document.getElementById(id + '_min').value = "不確定";
                                    updateSummary();
                                }
                                auraTypes.forEach(t => {
                                    const shortId = t.split('/')[0];
                                    document.write(`
                                        <div class="bg-slate-50 p-1.5 rounded border border-slate-200 flex flex-col">
                                            <label class="flex items-center gap-1.5 cursor-pointer mb-1">
                                                <input type="checkbox" name="aura_type" value="${t}" class="w-3 h-3 text-blue-800 rounded border-slate-300" onchange="toggleInlineFlex('${shortId}_input_group', this.checked)">
                                                <span class="text-xs text-slate-700">${t}</span>
                                            </label>
                                            <div id="${shortId}_input_group" class="hidden flex gap-1 fade-in">
                                                <input type="text" id="${shortId}_min" class="flex-1 text-[10px] p-1 border border-slate-300 rounded outline-none" placeholder="min">
                                                <button type="button" onclick="setUncertain('${shortId}')" class="text-[10px] bg-slate-200 hover:bg-slate-300 px-1.5 rounded text-slate-600">?</button>
                                            </div>
                                        </div>
                                    `);
                                });
                            </script>
                        </div>
                    </div>
                    
                    <!-- Medications -->
                    <div class="academic-section md:col-span-2">
                        <div class="flex items-center gap-2 mb-2">
                            <h2 class="section-title !mb-0 border-none">用藥紀錄 (PK)</h2>
                            <div class="flex items-center border border-slate-300 rounded px-1.5 bg-white w-24">
                                <input type="number" name="meds_per_month" min="0" class="w-full py-0.5 text-xs outline-none" placeholder="總天數">
                                <span class="text-[10px] text-slate-400">天/月</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-1.5">
                            <script>
                                const medsList = ["Panadol", "Panadol-ES", "EVE", "Ergot", "Triptans", "COX-2", "NSAIDs"];
                                medsList.forEach(m => {
                                    document.write(`
                                        <div class="flex items-center">
                                            <label class="cursor-pointer">
                                                <input type="checkbox" name="meds_list" value="${m}" class="chip-input sr-only" onchange="toggleInputInline('med_freq_${m}', this.checked)">
                                                <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">${m}</span>
                                            </label>
                                            <div id="med_freq_${m}" class="hidden items-center fade-in ml-1">
                                                 <input type="number" name="med_freq_${m}_val" class="w-12 px-1 py-0.5 text-xs border border-slate-400 rounded bg-white outline-none" placeholder="次/週">
                                            </div>
                                        </div>
                                    `);
                                });
                            </script>
                            <div class="flex items-center">
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="meds_other_check" class="chip-input sr-only" onchange="toggleInputInline('med_other_wrap', this.checked)">
                                    <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">其他</span>
                                </label>
                                <div id="med_other_wrap" class="hidden items-center fade-in gap-1 ml-1">
                                    <input type="text" name="meds_other_name" class="w-16 px-1 py-0.5 text-xs border border-slate-400 rounded bg-white outline-none" placeholder="藥名">
                                    <input type="number" name="med_freq_other" class="w-12 px-1 py-0.5 text-xs border border-slate-400 rounded bg-white outline-none" placeholder="次/週">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Red Flags (SNOOP) -->
                    <div class="academic-section">
                        <h2 class="section-title">警示症狀 (SNOP)</h2>
                        <div class="space-y-1">
                            <label class="flex items-start space-x-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
                                <input type="checkbox" name="snoop_s" value="S" class="mt-0.5 w-3.5 h-3.5 text-red-700 rounded border-slate-300">
                                <span class="text-xs text-slate-700 leading-tight">感冒、發燒、流鼻水、全身倦怠 (Systemic)</span>
                            </label>
                            <label class="flex items-start space-x-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
                                <input type="checkbox" name="snoop_n" value="N" class="mt-0.5 w-3.5 h-3.5 text-red-700 rounded border-slate-300">
                                <span class="text-xs text-slate-700 leading-tight">單側手腳無力等神經學表現 (Neurologic)</span>
                            </label>
                            <label class="flex items-start space-x-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
                                <input type="checkbox" name="snoop_p1" value="P" class="mt-0.5 w-3.5 h-3.5 text-red-700 rounded border-slate-300">
                                <span class="text-xs text-slate-700 leading-tight">頭痛症狀與早期有明顯不同 (Pattern)</span>
                            </label>
                            <label class="flex items-start space-x-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
                                <input type="checkbox" name="snoop_p2" value="P" class="mt-0.5 w-3.5 h-3.5 text-red-700 rounded border-slate-300">
                                <span class="text-xs text-slate-700 leading-tight">症狀明顯與姿勢變化有關 (Positional)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Exams -->
                    <div class="academic-section">
                        <h2 class="section-title">過去檢查 (Exams)</h2>
                        <div class="flex flex-wrap gap-1.5 mb-2">
                            <script>
                                const exams = ["MRI", "CT", "EEG", "Sono"];
                                exams.forEach(ex => {
                                    document.write(`
                                        <label class="cursor-pointer">
                                            <input type="checkbox" name="exam_${ex.toLowerCase()}" value="${ex}" class="chip-input sr-only">
                                            <span class="inline-block px-2 py-1 text-xs border border-slate-300 rounded bg-slate-50 text-slate-700 select-none hover:bg-slate-200">${ex}</span>
                                        </label>
                                    `);
                                });
                            </script>
                        </div>
                        <input type="text" name="exam_result" class="w-full text-xs p-1.5 border border-slate-300 rounded outline-none focus:border-blue-800" placeholder="檢查結果備註...">
                    </div>

                </div> <!-- End of Grid -->
            </div> <!-- End of Left Column -->

            <!-- Right Column: Live Summary -->
            <div class="w-full lg:w-80 bg-slate-800 text-slate-200 flex flex-col border-t lg:border-t-0 lg:border-l border-slate-700 shrink-0">
                <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Live Summary</span>
                    <button type="button" onclick="copySummary()" id="copyBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1 px-3 rounded flex items-center gap-1 transition-colors">
                        <i class="fa-regular fa-copy"></i> 複製
                    </button>
                </div>
                
                <div class="p-4 flex-1 overflow-y-auto custom-scroll text-sm font-mono leading-relaxed break-words whitespace-pre-wrap" id="summaryContent">
                    <!-- JS Injected Output -->
                </div>
                <textarea id="hiddenClipboard" class="hidden"></textarea>
            </div>
            
        </form>
    </div>

    <script>
        /* --- UI Helpers --- */
        function toggleInputInline(id, show) {
            const el = document.getElementById(id);
            if(show) {
                el.classList.remove('hidden');
                el.classList.add('flex');
                const input = el.querySelector('input[type="text"], input[type="number"]');
                if(input) input.focus();
            } else {
                el.classList.remove('flex');
                el.classList.add('hidden');
                const inputs = el.querySelectorAll('input');
                inputs.forEach(i => i.value = '');
            }
            updateSummary();
        }

        function toggleInlineFlex(id, show) {
            const el = document.getElementById(id);
            if(show) {
                el.classList.remove('hidden');
                el.classList.add('flex');
            } else {
                el.classList.remove('flex');
                el.classList.add('hidden');
                const radios = el.querySelectorAll('input[type="radio"]');
                radios.forEach(r => r.checked = false);
                const texts = el.querySelectorAll('input[type="text"]');
                texts.forEach(t => t.value = "");
            }
            updateSummary();
        }

        function toggleBlock(id, show) {
            const el = document.getElementById(id);
            if(show) {
                el.classList.remove('hidden');
                el.classList.add('grid'); // Based on current design
            } else {
                el.classList.remove('grid');
                el.classList.add('hidden');
                
                // Clean up children
                const checkboxes = el.querySelectorAll('input[type="checkbox"], input[type="radio"]');
                checkboxes.forEach(c => c.checked = false);
                const texts = el.querySelectorAll('input[type="text"]');
                texts.forEach(t => t.value = "");
                // Hide dynamic inline flexes within
                const divs = el.querySelectorAll('div[id]');
                divs.forEach(d => { 
                    if(d.id.includes('input_group') || d.id.includes('cas_side')) {
                        d.classList.add('hidden');
                        d.classList.remove('flex');
                    }
                });
            }
            updateSummary();
        }

        /* --- Summary Generation --- */
        const form = document.getElementById('headacheForm');
        
        function updateSummary() {
            const formData = new FormData(form);
            const getAll = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i => i.value);
            const getValue = (name, def = '') => formData.get(name) || def;

            // 1. Basic Info
            const permit = document.getElementById('consent').checked ? '已同意' : '未同意';
            const onset = getValue('first_headache_age', '-');
            const aggra = getValue('worse_headache_age', '-');
            
            // 2. Location & Side & Nature
            let locs = getAll('location');
            if(formData.get('location_other_check')) { const o = getValue('location_other'); if(o) locs.push(o); }
            const locStr = locs.join('/') || '-';

            let sides = getAll('side');
            if(formData.get('side_other_check')) { const o = getValue('side_other'); if(o) sides.push(o); }
            const latStr = sides.join('/') || '-';

            let natures = getAll('nature');
            if(formData.get('nature_other_check')) { const o = getValue('nature_other'); if(o) natures.push(o); }
            const qualStr = natures.join('/') || '-';

            // 3. Scores
            const pulsatile = getValue('pulsatile', '-');
            const nrsAvg = getValue('pain_level_avg', '-');
            const nrsMax = getValue('pain_level_max', '-');
            const dur = getValue('duration', '-');
            
            // 4. Symptoms
            const n_sym = getValue('nausea', '-');
            const v_sym = getValue('vomiting', '-');
            const l_sym = getValue('sound_sens', '-');
            const s_sym = getValue('light_sens', '-');
            const pa_sym = getValue('movement_aggravation', '-');
            
            // 5. CAS
            let casStr = "CAS(-)";
            if (formData.get('cas_check') === 'yes') {
                const casList = getAll('cas_symptoms');
                let casDetails = [];
                casList.forEach(sym => {
                    const side = document.querySelector(`input[name="cas_side_${sym}"]:checked`)?.value;
                    casDetails.push(`${sym}${side ? '('+side+')' : ''}`);
                });
                casStr = casDetails.length > 0 ? `CAS(${casDetails.join(', ')})` : `CAS(+)`;
            }

            // 6. Aura
            const aura_check = getValue('aura_check', '-');
            let auraStr = `Aura(${aura_check})`;
            if(aura_check === '+'){
                const types = getAll('aura_type');
                if(types.length > 0) {
                    const details = types.map(t => {
                        const shortId = t.split('/')[0];
                        const d = document.getElementById(`${shortId}_min`)?.value;
                        return `${t}${d ? ':' + d + 'min' : ''}`;
                    });
                    auraStr = `Aura(${details.join(', ')})`;
                }
            }

            // 7. Freq & Meds
            const freq = getValue('days_per_month', '-');
            const pk_days = getValue('meds_per_month', '-');
            
            let medSummary = [];
            getAll('meds_list').forEach(m => {
                const f = formData.get(`med_freq_${m}_val`);
                medSummary.push(`${m}${f ? '('+f+'次/週)' : ''}`);
            });
            if(formData.get('meds_other_check')) {
                const name = formData.get('meds_other_name');
                const f = formData.get('med_freq_other');
                if(name) medSummary.push(`${name}${f ? '('+f+'次/週)' : ''}`);
            }
            const medStr = medSummary.length > 0 ? medSummary.join('/') : '-';
            
            // 8. SNOOP
            const snoop_s = formData.get('snoop_s') ? '+' : '-';
            const snoop_n = formData.get('snoop_n') ? '+' : '-';
            const snoop_o_age = (parseInt(onset) > 40) ? '+' : '-';
            const snoop_o_thunder = '-'; 
            const snoop_p = (formData.get('snoop_p1') || formData.get('snoop_p2')) ? '+' : '-';

            // 9. Exams
            const mri = formData.get('exam_mri') ? '(+)' : '(-)';
            const ct = formData.get('exam_ct') ? '(+)' : '(-)';
            const eeg = formData.get('exam_eeg') ? '(+)' : '(-)';
            const sono = formData.get('exam_sono') ? '(+)' : '(-)';
            const exam_note = getValue('exam_result');
            const examStr = `MRI${mri} CT${ct} EEG${eeg} Sono${sono}${exam_note ? ' ['+exam_note+']' : ''}`;

            // --- BUILD STRING ---
            const text = `HA (permit = ${permit}), Onset = ${onset}, Aggra = ${aggra}, Loc=${locStr}, Lat=${latStr}, Qual=${qualStr}, Pulsatile(${pulsatile}), NRS = ${nrsAvg}/${nrsMax}, Dur=${dur} hr, N(${n_sym}), V(${v_sym}), L(${l_sym}), S(${s_sym}), PA(${pa_sym}), ${casStr}, ${auraStr}, Freq=${freq}/month, PK=${pk_days}/month(${medStr}), RedFlags: S(${snoop_s}) N(${snoop_n}) O(${snoop_o_age}) O(${snoop_o_thunder}) P(${snoop_p}), Exams: ${examStr}`;

            document.getElementById('summaryContent').innerText = text;
            document.getElementById('hiddenClipboard').value = text;
        }

        /* --- Copy Function --- */
        function copySummary() {
            const copyText = document.getElementById("hiddenClipboard");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            
            try {
                navigator.clipboard.writeText(copyText.value).then(() => {
                    showCopyFeedback();
                }).catch(err => {
                    document.execCommand("copy");
                    showCopyFeedback();
                });
            } catch (err) {
                 document.execCommand("copy");
                 showCopyFeedback();
            }
        }

        function showCopyFeedback() {
            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> OK';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-green-600', 'bg-blue-600');
            }, 2000);
        }

        // Event Listeners for real-time update
        form.addEventListener('input', updateSummary);
        form.addEventListener('change', updateSummary);
        
        // Initial setup
        updateSummary();

    </script>
</body>
</html>
