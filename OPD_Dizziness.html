<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一般頭暈初診問卷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', 'Microsoft JhengHei', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* 隱藏原生單選框，但保留功能 */
        .custom-radio:checked + span {
            background-color: #eff6ff; /* blue-50 */
            border-color: #3b82f6; /* blue-500 */
            color: #1e40af; /* blue-800 */
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-[1400px] mx-auto px-4 py-6">
        
        <!-- 上方動作區塊 -->
        <div class="mb-6 flex justify-end">
            <button onclick="window.location.reload()" class="flex items-center justify-center gap-2 px-4 py-2 bg-white hover:bg-slate-50 text-slate-600 rounded-xl text-sm font-medium transition-colors border border-slate-200 shadow-sm w-full md:w-auto">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>重新填寫 (Reset)</span>
            </button>
        </div>

        <!-- 三欄式主要內容區 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- 【第一欄】 症狀類型與發生時間 -->
            <div class="space-y-5 flex flex-col">
                
                <!-- 1. Symptom Type -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                        症狀類型 (最符合的一項)
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="symptom-type-group">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="lightheadedness" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">頭重腳輕 (Lightheaded)</span>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="falling" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">快跌倒感 (Falling)</span>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="balance" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">走路不平衡 (Balance)</span>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="externalVertigo" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">環境旋轉 (Ext. vertigo)</span>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="internalVertigo" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">自身旋轉 (Int. vertigo)</span>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="symptomType" value="environmentMoving" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all h-full">視野晃動 (Moving)</span>
                        </label>
                        <label class="relative cursor-pointer sm:col-span-2">
                            <input type="radio" name="symptomType" value="other" class="custom-radio sr-only">
                            <span class="flex items-center p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all">其他 (Other)</span>
                        </label>
                    </div>
                    
                    <!-- 其他症狀文字框 -->
                    <div id="symptom-other-sub" class="hidden mt-3">
                        <input type="text" id="symptom-other-val" placeholder="請輸入其他症狀描述..." class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                    </div>

                    <!-- Direction Sub-questions -->
                    <div id="direction-sub" class="hidden mt-4 p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                        <p class="text-sm font-medium mb-3 text-slate-700">偏向哪一邊？</p>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" onclick="setDirection('前')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">前</button>
                            <button type="button" onclick="setDirection('後')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">後</button>
                            <button type="button" onclick="setDirection('左')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">左</button>
                            <button type="button" onclick="setDirection('右')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">右</button>
                            <button type="button" onclick="setDirection('不確定')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">不確定</button>
                            <button type="button" onclick="setDirection('不定向')" class="dir-btn px-3 py-1.5 rounded-lg border bg-white text-sm hover:border-blue-500 transition-colors">不定向</button>
                        </div>
                    </div>
                </section>

                <!-- 2. Onset -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                        發生時間與次數
                    </h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-600 mb-1">首次發生時間</label>
                            <input type="text" id="first-onset" placeholder="如: 2023年10月" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-600 mb-1">本次是第幾次</label>
                            <input type="number" id="episode-count" placeholder="次數" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </section>

                <!-- 3. Frequency & Duration -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
                        發生模式與持續時間
                    </h2>
                    <div class="flex gap-2 mb-4">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="pattern" value="episodic" checked class="custom-radio sr-only">
                            <span class="block p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all">一陣一陣 (Episodic)</span>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="pattern" value="constant" class="custom-radio sr-only">
                            <span class="block p-2.5 rounded-xl border border-slate-200 text-sm hover:bg-slate-50 transition-all">持續存在 (Constant)</span>
                        </label>
                    </div>
                    
                    <div id="episodic-details" class="flex flex-col gap-3 p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-sm text-slate-700 font-medium w-16">持續：</span>
                            <input type="text" id="duration-val" placeholder="數字" class="w-16 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <select id="duration-unit" class="p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none flex-1">
                                <option value="seconds">秒</option>
                                <option value="minutes" selected>分鐘</option>
                                <option value="hours">小時</option>
                                <option value="days">天</option>
                            </select>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-sm text-slate-700 font-medium w-16">頻率約：</span>
                            <input type="text" id="freq-val" placeholder="數字" class="w-16 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <select id="freq-unit" class="p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none flex-1">
                                <option value="day">次 / 天</option>
                                <option value="week">次 / 週</option>
                                <option value="month" selected>次 / 月</option>
                            </select>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 【第二欄】 伴隨症狀與誘發因子 -->
            <div class="space-y-5 flex flex-col">
                
                <!-- 4. Associated Symptoms -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">4</span>
                        伴隨症狀 (可複選)
                    </h2>
                    <div class="flex flex-wrap gap-2 mb-3" id="associated-container">
                        <!-- Buttons populated by JS -->
                    </div>
                    <div>
                        <input type="text" id="associated-other" placeholder="其他伴隨症狀 (自由填寫)..." class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none mt-1">
                    </div>
                </section>

                <!-- 5. Triggers -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">5</span>
                        誘發因子 (可複選)
                    </h2>
                    <div class="flex flex-wrap gap-2 mb-3" id="trigger-container">
                        <!-- Buttons populated by JS -->
                    </div>
                    <div>
                        <input type="text" id="trigger-other" placeholder="其他誘發因子 (自由填寫)..." class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none mt-1">
                    </div>
                </section>

                <!-- 6. Better/Worse -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">6</span>
                        舒緩與惡化因素
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-600 mb-1">什麼狀況下較好？ (Relieving)</label>
                            <input type="text" id="relieving" placeholder="如：平躺、閉眼" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-600 mb-1">什麼狀況會惡化？ (Aggravating)</label>
                            <input type="text" id="aggravating" placeholder="如：轉頭、光線" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </section>
            </div>

            <!-- 【第三欄】 Note Summary (Sticky) -->
            <div class="lg:sticky lg:top-6 flex flex-col h-full lg:h-[calc(100vh-8rem)]">
                <div class="bg-slate-900 rounded-2xl shadow-xl flex flex-col h-full border border-slate-800">
                    
                    <!-- 標題與複製按鈕 -->
                    <div class="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-900/50 rounded-t-2xl shrink-0">
                        <h2 class="text-base font-bold flex items-center gap-2 text-white">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-400"></i>
                            Note Summary
                        </h2>
                        <button onclick="copySummary()" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors shadow-sm">
                            <i data-lucide="copy" id="copy-icon" class="w-4 h-4"></i>
                            <span id="copy-text">Copy</span>
                        </button>
                    </div>

                    <!-- 成功訊息 -->
                    <div id="copy-message" class="hidden bg-emerald-500 text-white px-4 py-2 text-center text-sm font-medium transition-all shrink-0">
                        ✓ Note Summary 已成功複製！
                    </div>

                    <!-- 輸出結果 (Scrollable) -->
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                        <div id="summary-output" class="text-[13px] leading-relaxed whitespace-pre-wrap font-mono text-slate-300">
                            Patient presents with dizziness. Initial assessment...
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // State Management
        let state = {
            symptomType: '',
            symptomTypeOther: '',
            direction: '',
            firstOnset: '',
            episodeCount: '',
            pattern: 'episodic',
            durationVal: '',
            durationUnit: 'minutes',
            freqVal: '',
            freqUnit: 'month',
            associated: [],
            associatedOther: '',
            triggers: [],
            triggerOther: '',
            relieving: '',
            aggravating: ''
        };

        const symptomMap = {
            lightheadedness: 'Lightheadedness',
            falling: 'Falling tendency',
            balance: 'Loss of balance',
            externalVertigo: 'External vertigo',
            internalVertigo: 'Internal vertigo',
            environmentMoving: 'Oscillopsia (Environment moving)',
            other: 'Other'
        };

        const associatedOptions = [
            { zh: '複視', en: 'Diplopia' }, { zh: '失去意識', en: 'Loss of consciousness' },
            { zh: '視力模糊', en: 'Blurred vision' }, { zh: '頭痛', en: 'Headache' },
            { zh: '噁心', en: 'Nausea' }, { zh: '嘔吐', en: 'Vomiting' },
            { zh: '胸悶', en: 'Chest tightness' }, { zh: '胸痛', en: 'Chest pain' },
            { zh: '心悸', en: 'Palpitations' }, { zh: '手腳麻', en: 'Numbness' },
            { zh: '手腳無力', en: 'Weakness' }, { zh: '聽力下降', en: 'Hearing loss' },
            { zh: '耳鳴', en: 'Tinnitus' }
        ];

        const triggerOptions = [
            { zh: '姿勢變化(躺下)', en: 'Positional (lying down)' },
            { zh: '姿勢變化(起身)', en: 'Positional (standing up)' },
            { zh: '姿勢變化(轉頭)', en: 'Positional (head turning)' },
            { zh: '用力', en: 'Valsalva maneuver' },
            { zh: '搭飛機', en: 'Air travel' },
            { zh: '潛水', en: 'Diving' },
            { zh: '感冒發燒', en: 'Common cold/fever' }
        ];

        const positionalTriggersEn = [
            'Positional (lying down)', 
            'Positional (standing up)', 
            'Positional (head turning)'
        ];

        // Initialize UI
        function init() {
            lucide.createIcons();
            renderCheckboxes('associated-container', associatedOptions, 'associated');
            renderCheckboxes('trigger-container', triggerOptions, 'triggers');
            setupEventListeners();
            updateSummary();
        }

        function renderCheckboxes(containerId, options, stateKey) {
            const container = document.getElementById(containerId);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1.5 rounded-lg border border-slate-200 text-sm bg-white transition-all hover:bg-slate-50 text-slate-700 shadow-sm';
                btn.innerText = opt.zh;
                btn.onclick = () => {
                    const index = state[stateKey].indexOf(opt.en);
                    if (index > -1) {
                        state[stateKey].splice(index, 1);
                        btn.classList.remove('bg-blue-100', 'text-blue-800', 'border-blue-400', 'font-medium');
                    } else {
                        state[stateKey].push(opt.en);
                        btn.classList.add('bg-blue-100', 'text-blue-800', 'border-blue-400', 'font-medium');
                    }
                    updateSummary();
                };
                container.appendChild(btn);
            });
        }

        function setupEventListeners() {
            // Symptom Type
            document.querySelectorAll('input[name="symptomType"]').forEach(input => {
                input.onchange = (e) => {
                    state.symptomType = e.target.value;
                    document.getElementById('direction-sub').classList.toggle('hidden', !['falling', 'balance'].includes(state.symptomType));
                    document.getElementById('symptom-other-sub').classList.toggle('hidden', state.symptomType !== 'other');
                    updateSummary();
                };
            });

            // Pattern
            document.querySelectorAll('input[name="pattern"]').forEach(input => {
                input.onchange = (e) => {
                    state.pattern = e.target.value;
                    document.getElementById('episodic-details').classList.toggle('hidden', state.pattern === 'constant');
                    updateSummary();
                };
            });

            // Text Inputs
            ['first-onset', 'episode-count', 'duration-val', 'freq-val', 'relieving', 'aggravating', 'symptom-other-val', 'associated-other', 'trigger-other'].forEach(id => {
                const field = document.getElementById(id);
                if (!field) return;
                field.oninput = (e) => {
                    if(id === 'first-onset') state.firstOnset = e.target.value;
                    if(id === 'episode-count') state.episodeCount = e.target.value;
                    if(id === 'duration-val') state.durationVal = e.target.value;
                    if(id === 'freq-val') state.freqVal = e.target.value;
                    if(id === 'relieving') state.relieving = e.target.value;
                    if(id === 'aggravating') state.aggravating = e.target.value;
                    if(id === 'symptom-other-val') state.symptomTypeOther = e.target.value;
                    if(id === 'associated-other') state.associatedOther = e.target.value;
                    if(id === 'trigger-other') state.triggerOther = e.target.value;
                    updateSummary();
                };
            });

            // Selects
            document.getElementById('duration-unit').onchange = (e) => { state.durationUnit = e.target.value; updateSummary(); };
            document.getElementById('freq-unit').onchange = (e) => { state.freqUnit = e.target.value; updateSummary(); };
        }

        function setDirection(d) {
            state.direction = d;
            document.querySelectorAll('.dir-btn').forEach(btn => {
                btn.classList.toggle('bg-blue-100', btn.innerText === d);
                btn.classList.toggle('text-blue-800', btn.innerText === d);
                btn.classList.toggle('border-blue-400', btn.innerText === d);
                btn.classList.toggle('font-medium', btn.innerText === d);
            });
            updateSummary();
        }

        function updateSummary() {
            let summary = "Patient presents with dizziness.\n\n";

            // 1. Symptom Type
            if (state.symptomType) {
                if (state.symptomType === 'other') {
                    summary += `[Symptom] Primary symptom: ${state.symptomTypeOther || 'Not specified'}.\n`;
                } else {
                    summary += `[Symptom] Primary symptom: ${symptomMap[state.symptomType]}.\n`;
                }
                
                if (['falling', 'balance'].includes(state.symptomType) && state.direction) {
                    const dMap = {
                        '前':'forward', 
                        '後':'backward', 
                        '左':'to the left', 
                        '右':'to the right',
                        '不確定': 'unsure direction',
                        '不定向': 'non-directional'
                    };
                    summary += `          (Direction: ${dMap[state.direction] || state.direction})\n`;
                }
            }

            // 2. Onset & Pattern
            summary += `[History] Onset: ${state.firstOnset || 'Not specified'}. Episode count: ${state.episodeCount || '1'}.\n`;
            summary += `          Pattern: ${state.pattern === 'constant' ? 'Constant' : 'Episodic'}.\n`;

            if (state.pattern === 'episodic' && state.durationVal) {
                summary += `          Duration: ~${state.durationVal} ${state.durationUnit}. `;
                if (state.freqVal) {
                    summary += `Frequency: ~${state.freqVal} per ${state.freqUnit}. `;
                }
                summary += `\n`;
            }

            // 3. Associated Symptoms (+/-)
            let assocList = associatedOptions.map(opt => {
                return `${opt.en} (${state.associated.includes(opt.en) ? '+' : '-'})`;
            });
            summary += `\n[Associated Symptoms]\n${assocList.join(', ')}.\n`;
            
            if (state.associatedOther) {
                summary += `Other: ${state.associatedOther}\n`;
            }

            // 4. Triggers (Positional logic)
            const selectedPositional = state.triggers.filter(t => positionalTriggersEn.includes(t));
            const selectedNonPositional = state.triggers.filter(t => !positionalTriggersEn.includes(t));

            summary += `\n[Triggers & Factors]\n`;
            if (selectedPositional.length === 0) {
                summary += `Position (-)\n`;
            } else {
                const directions = selectedPositional.map(t => t.replace('Positional (', '').replace(')', ''));
                summary += `Position (+) [${directions.join(', ')}]\n`;
            }

            if (selectedNonPositional.length > 0) {
                summary += `Other triggers: ${selectedNonPositional.join(', ')}\n`;
            }
            if (state.triggerOther) {
                summary += `Additional triggers: ${state.triggerOther}\n`;
            }

            // 5. Relieving / Aggravating
            if (state.relieving) summary += `Relieved by: ${state.relieving}\n`;
            if (state.aggravating) summary += `Aggravated by: ${state.aggravating}\n`;

            document.getElementById('summary-output').innerText = summary.trim();
        }

        function copySummary() {
            const text = document.getElementById('summary-output').innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            // UI Feedback
            const msg = document.getElementById('copy-message');
            msg.classList.remove('hidden');
            
            // Change button style briefly
            const icon = document.getElementById('copy-icon');
            const textSpan = document.getElementById('copy-text');
            icon.setAttribute('data-lucide', 'check');
            textSpan.innerText = 'Copied!';
            lucide.createIcons();

            setTimeout(() => {
                msg.classList.add('hidden');
                icon.setAttribute('data-lucide', 'copy');
                textSpan.innerText = 'Copy';
                lucide.createIcons();
            }, 2500);
        }

        window.onload = init;
